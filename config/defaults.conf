# Runtime defaults. Every value can be overridden by a CLI option or the
# matching SERVER_DOCTOR_* environment variable.
SERVER_DOCTOR_PROFILE="${SERVER_DOCTOR_PROFILE:-standard}"
SERVER_DOCTOR_SINCE="${SERVER_DOCTOR_SINCE:-24h}"
SERVER_DOCTOR_OUTPUT="${SERVER_DOCTOR_OUTPUT:-./artifacts}"
SERVER_DOCTOR_MAX_REPORT_MIB="${SERVER_DOCTOR_MAX_REPORT_MIB:-1024}"
SERVER_DOCTOR_MIN_FREE_MIB="${SERVER_DOCTOR_MIN_FREE_MIB:-1536}"
SERVER_DOCTOR_MAX_FILE_MIB="${SERVER_DOCTOR_MAX_FILE_MIB:-20}"
SERVER_DOCTOR_COMMAND_TIMEOUT="${SERVER_DOCTOR_COMMAND_TIMEOUT:-120}"
SERVER_DOCTOR_DISK_SCAN_TIMEOUT="${SERVER_DOCTOR_DISK_SCAN_TIMEOUT:-900}"
SERVER_DOCTOR_PCP_TIMEOUT="${SERVER_DOCTOR_PCP_TIMEOUT:-900}"
SERVER_DOCTOR_OBSERVE_SECONDS="${SERVER_DOCTOR_OBSERVE_SECONDS:-}"
SERVER_DOCTOR_ENCRYPT_TO="${SERVER_DOCTOR_ENCRYPT_TO:-}"

# Thresholds used only for summary.md. The collector never remediates issues.
SERVER_DOCTOR_WARN_PERCENT="${SERVER_DOCTOR_WARN_PERCENT:-80}"
